# Full-stack compose for local development.
#
# `pnpm dev` starts ONLY the postgres and minio services from this file and runs
# the API and web natively. Use `docker compose -p takeinitiative -f compose.dev.yml
# up -d --build` when you want everything in containers instead.
#
# Ports: postgres 7401, api 7402, web 7403, minio 7404 (S3 API) and 7405 (console).
# `docker compose -p takeinitiative -f compose.dev.yml down -v` resets the database
# and the images together.

services:
    postgres:
        # Pinned to a MAJOR, and matched to the image the Alba/Testcontainers suite
        # uses (apps/TakeInitiative.Api.Tests/Scopes/Integration/*Fixture.cs), so dev
        # and test run against the same major version.
        #
        # 16 specifically, and not merely "newer than 15": Marten's own CI runs
        # against 15 and 16, so this sits inside the matrix upstream actually tests
        # rather than ahead of it. For a project whose entire persistence layer is
        # Marten, being in that set is worth more than being current.
        #
        # Never `postgres:latest`. `latest` floats across majors, and from 18 onward
        # each major also changes the data directory (see the volume below), so
        # `latest` eventually arrives as a container that refuses to start rather
        # than as a decision anybody made.
        image: postgres:16-alpine
        container_name: takedb
        ports:
            - "7401:5432"
        volumes:
            # /var/lib/postgresql/data is correct for 16, and is the layout every
            # Postgres compose file written before 2025 uses.
            #
            # WHEN THIS EVENTUALLY MOVES TO 18+, THIS LINE HAS TO CHANGE. At 18 the
            # official image made PGDATA version specific
            # (`/var/lib/postgresql/18/docker`) and moved its declared VOLUME up to
            # `/var/lib/postgresql`, so data lands in a per-major subdirectory and
            # `pg_upgrade --link` has no mount-point boundary to cross. Measured
            # 2026-10-07: an 18 container with a volume still mounted here exits 1
            # with "/var/lib/postgresql/data (unused mount/volume)". Staying on 16
            # is what makes this a note rather than a problem.
            #
            # A named volume rather than a host bind mount: portable across machines,
            # and `docker compose down -v` resets it cleanly.
            #
            # ONE-TIME, coming from 15: Postgres will not read another major's data
            # directory. A 16 server against a 15 volume exits 1 with "database files
            # are incompatible with server ... initialized by PostgreSQL version 15"
            # — clear, at least. Dev data is disposable, so reset it once:
            #     docker compose -p takeinitiative -f compose.dev.yml down -v
            # then `pnpm dev`, which recreates the schema on API startup.
            - takedb-data:/var/lib/postgresql/data
        environment:
            - POSTGRES_PASSWORD=postgres
            - POSTGRES_USER=postgres
            - POSTGRES_DB=postgres
        restart: always
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres"]
            interval: 10s
            retries: 5
            start_period: 10s
            timeout: 5s
    minio:
        # The image blob store (step 16a). MinIO stopped publishing community images in
        # 2025, and its quay.io and Docker Hub repositories no longer pull anonymously
        # (the tag Ripple pins, RELEASE.2025-07-18T21-56-31Z, only works where it is
        # already cached). pgsty/minio is a community build of the same MinIO server,
        # with the same entrypoint, environment and `mc`. The API only speaks S3, so
        # swapping it (Garage, SeaweedFS, RustFS) is a change here and in
        # MinioFixture.Image alone. There is no bucket-creating container: the API
        # creates its bucket on start (Blobs:CreateBucket), and the bucket stays private.
        image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
        container_name: takeminio
        command: server /data --console-address ":9001"
        ports:
            - "7404:9000" # S3 API
            - "7405:9001" # console (takeinitiative / takeinitiative-dev)
        environment:
            - MINIO_ROOT_USER=takeinitiative
            - MINIO_ROOT_PASSWORD=takeinitiative-dev
        volumes:
            - takeminio-data:/data
        restart: always
        healthcheck:
            test: ["CMD", "mc", "ready", "local"]
            interval: 10s
            retries: 5
            start_period: 10s
            timeout: 5s
    api:
        # Tagged rather than anonymous, so a built image is identifiable.
        # `pnpm sync:version` writes TAKEINITIATIVE_VERSION into the root .env
        # from package.json; without it the tag falls back to :latest.
        image: takeinitiative-api:${TAKEINITIATIVE_VERSION:-latest}
        build:
            # The repo root, so the API can reference packages/TakeInitiative.Dice.
            context: .
            dockerfile: apps/TakeInitiative.Api/dockerfile
        container_name: takeapi
        depends_on:
            postgres:
                condition: service_healthy
            minio:
                condition: service_healthy
        ports:
            - "7402:8080"
        environment:
            - "ConnectionStrings:TakeDB=User ID=postgres;Password=postgres;Host=postgres;Port=5432;Database=postgres;"
            - "CORS:MainApp=http://localhost:7403;https://localhost:7403"
            # There is no admin frontend in this repo; this only exists because
            # Program.cs requires the key to be present.
            - "CORS:AdminApp=http://localhost:3001;https://localhost:3001"
            - "AllowedHosts=localhost"
            - "CookieDomain=localhost"
            # The other Blobs:* keys keep their appsettings.json dev defaults.
            - "Blobs__ServiceUrl=http://minio:9000"
        restart: always
        healthcheck:
            test: ["CMD-SHELL", "curl --fail http://localhost:8080/healthz || exit 1"]
            interval: 30s
            retries: 5
            start_period: 30s
            timeout: 10s
    web:
        image: takeinitiative-web:${TAKEINITIATIVE_VERSION:-latest}
        build:
            # The repo root, because pnpm needs the workspace lockfile.
            context: .
            dockerfile: apps/TakeInitiative.Web/Dockerfile
            args:
                # nuxt.config.ts reads these at BUILD time, so they have to be
                # build args - setting them as container env vars does nothing.
                API_URL: http://localhost:7402
                WEB_URL: http://localhost:7403
        container_name: takeweb
        depends_on:
            - api
        ports:
            - "7403:3000"
        restart: always
        healthcheck:
            # The image carries its own HEALTHCHECK on the same route; this repeats it
            # so `docker compose ps` reports health with the interval dev wants.
            # busybox wget - node:24-alpine has no curl.
            test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/healthz || exit 1"]
            interval: 30s
            retries: 5
            start_period: 30s
            timeout: 10s

volumes:
    takedb-data:
    takeminio-data:
