# Full-stack compose for local development.
#
# `pnpm dev` starts ONLY the postgres and garage services from this file, bootstraps Garage,
# and runs the API and web natively. Use `docker compose -p takeinitiative -f compose.dev.yml
# up -d --build` when you want everything in containers instead.
#
# Ports: postgres 7401, api 7402, web 7403, garage 7404 (S3 API) and 7405 (admin API).
# `docker compose -p takeinitiative -f compose.dev.yml down -v` resets the database
# and the images together.

services:
    postgres:
        # Matched to the Testcontainers fixtures; 16 is the newest major Marten's CI covers.
        image: postgres:16-alpine
        container_name: takedb
        ports:
            - "7401:5432"
        volumes:
            - takedb-data:/var/lib/postgresql/data
        environment:
            - POSTGRES_PASSWORD=postgres
            - POSTGRES_USER=postgres
            - POSTGRES_DB=postgres
        restart: always
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres"]
            interval: 10s
            retries: 5
            start_period: 10s
            timeout: 5s
    garage:
        # The S3 blob store (step 16a). Garage, not MinIO: MinIO changed its deployment model
        # and stopped publishing usable community images. Unlike MinIO it needs a config file
        # and a CLI bootstrap (cluster layout, access key, bucket) — `pnpm setup:garage` does
        # that, idempotently, and `pnpm dev` runs it.
        image: dxflrs/garage:v2.3.0
        container_name: takegarage
        ports:
            - "7404:3900" # S3 API
            - "7405:3903" # admin API
        volumes:
            - ./infra/garage.dev.toml:/etc/garage.toml:ro
            - takegarage-meta:/var/lib/garage/meta
            - takegarage-data:/var/lib/garage/data
        restart: always
        healthcheck:
            test: ["CMD", "/garage", "status"]
            interval: 10s
            retries: 5
            start_period: 10s
            timeout: 5s
    api:
        # Tagged rather than anonymous, so a built image is identifiable.
        # `pnpm sync:version` writes TAKEINITIATIVE_VERSION into the root .env
        # from package.json; without it the tag falls back to :latest.
        image: takeinitiative-api:${TAKEINITIATIVE_VERSION:-latest}
        build:
            # The repo root, so the API can reference packages/TakeInitiative.Dice.
            context: .
            dockerfile: apps/TakeInitiative.Api/dockerfile
        container_name: takeapi
        depends_on:
            postgres:
                condition: service_healthy
            garage:
                condition: service_healthy
        ports:
            - "7402:8080"
        environment:
            - "ConnectionStrings:TakeDB=User ID=postgres;Password=postgres;Host=postgres;Port=5432;Database=postgres;"
            - "CORS:MainApp=http://localhost:7403;https://localhost:7403"
            # There is no admin frontend in this repo; this only exists because
            # Program.cs requires the key to be present.
            - "CORS:AdminApp=http://localhost:3001;https://localhost:3001"
            - "AllowedHosts=localhost"
            - "CookieDomain=localhost"
            # The other Blobs:* keys keep their appsettings.json dev defaults.
            - "Blobs__ServiceUrl=http://garage:3900"
        restart: always
        healthcheck:
            test: ["CMD-SHELL", "curl --fail http://localhost:8080/healthz || exit 1"]
            interval: 30s
            retries: 5
            start_period: 30s
            timeout: 10s
    web:
        image: takeinitiative-web:${TAKEINITIATIVE_VERSION:-latest}
        build:
            # The repo root, because pnpm needs the workspace lockfile.
            context: .
            dockerfile: apps/TakeInitiative.Web/Dockerfile
            args:
                # nuxt.config.ts reads these at BUILD time, so they have to be
                # build args - setting them as container env vars does nothing.
                API_URL: http://localhost:7402
                WEB_URL: http://localhost:7403
        container_name: takeweb
        depends_on:
            - api
        ports:
            - "7403:3000"
        restart: always
        healthcheck:
            # The image carries its own HEALTHCHECK on the same route; this repeats it
            # so `docker compose ps` reports health with the interval dev wants.
            # busybox wget - node:24-alpine has no curl.
            test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/healthz || exit 1"]
            interval: 30s
            retries: 5
            start_period: 30s
            timeout: 10s

volumes:
    takedb-data:
    takegarage-meta:
    takegarage-data:
