name: Release

on:
    push:
        branches:
            - dev

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
    contents: write
    pull-requests: write

jobs:
    release:
        name: Generate release PR
        runs-on: ubuntu-latest
        steps:
            - name: Create release pull request
              uses: googleapis/release-please-action@v4
              id: release
              with:
                  config-file: release-please-config.json
                  manifest-file: .release-please-manifest.json

            # release-please only bumps package.json. Everything else that
            # carries the version is written here, onto the same PR branch.
            - name: Checkout the release-please branch
              if: ${{ steps.release.outputs.prs_created == 'true' }}
              uses: actions/checkout@v4
              with:
                  ref: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}

            - name: Setup node
              if: ${{ steps.release.outputs.prs_created == 'true' }}
              uses: actions/setup-node@v4
              with:
                  node-version: 24

            - name: Propagate the version
              if: ${{ steps.release.outputs.prs_created == 'true' }}
              run: |
                  node scripts/sync-version.mjs

                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git add apps/TakeInitiative.Api/TakeInitiative.Api.csproj
                  if ! git diff --cached --quiet; then
                    git commit -m "chore(root): sync the version into the csproj"
                    git push
                  fi
