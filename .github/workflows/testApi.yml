# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: Test Api

on:
  push:
    branches: [ "dev" ]
    paths:
      - ".github/workflows/testApi.yml"
      - "**.cs"
      - "**.csproj"
  pull_request:
    # NO `branches:` FILTER, DELIBERATELY — every pull request is gated, whatever it
    # targets. CLAUDE.md requires the gates on each PR in a stack rather than only on the
    # tip, and a filtered list cannot deliver that: a PR based on another feature branch
    # matched nothing and got ZERO checks, which reads as green because nothing was asked
    # of it. Enumerating branch patterns only moves the hole around — this repo already
    # has `fix/`, `chore/`, `feat/` and `release/` branches that a `v2/**` guess missed.
    #
    # The `paths:` filter below still applies, so a docs-only PR still runs nothing, and
    # `pull_request` (not `pull_request_target`) means a fork's PR gets a read-only token
    # and no secrets.
    paths:
      - ".github/workflows/testApi.yml"
      - "**.cs"
      - "**.csproj"
  workflow_dispatch: ~
  

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore dependencies
        run: dotnet restore
      - name: Build
        run: |
          dotnet build --configuration Release --no-restore -p:TreatWarningsAsErrors=True
      - name: Test
        run: dotnet test -- --verbosity normal
